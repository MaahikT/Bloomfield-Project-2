# Washtenaw County, MI. Links from NETR Online (pulled Nov 14, 2026). Status: manual_inbox until a person checks
# each site's terms of use / robots.txt (NETR itself is approved; every county site is still screened).
county: Washtenaw County
state: MI
fips: "26161"
status: manual_inbox
priority: 1
netr_page: "https://publicrecords.netronline.com/state/MI/county/washtenaw"
notes: "Ann Arbor is our demo market (student housing). Recorder first: it feeds the loan clock, Bloomfield's strongest signal."

sources:
  recorder:                       # PRIORITY 1 -> L loan clock (Part A recorded_loans)
    access: manual_inbox
    url: "https://ssclerk.ewashtenaw.org/web/"
    phone: "(734) 222-6710"
    notes: >-
      Washtenaw County Register of Deeds. Pull: construction mortgages; mortgage modifications and extensions
      (a modification on ANY short-term loan starts the loan clock); assignments; discharges / releases and new
      permanent mortgages (stop the clock); claims of lien / construction liens and lis pendens (READY TO ACT).
      Until checked, drop documents into data/inbox/recorder/MI/<county>/.
  court:                          # READY TO ACT confirmation (foreclosure, receivership, lender lawsuits)
    access: manual_inbox
    notes: "Washtenaw County Trial Court (22nd Circuit and 14A District) case search (not on NETR). Drop filings into data/inbox/county_court/MI/<county>/."
  public_notice:                  # READY TO ACT (foreclosure by advertisement, sheriff sales)
    access: manual_inbox
    notes: "Michigan foreclosure by advertisement is published in newspapers and posted by the Sheriff (see mi_statewide). Drop notices into data/inbox/public_notice/MI/<county>/."

